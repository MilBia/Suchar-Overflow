{% load i18n %}

<div class="achievement-tags mt-2">
  {% if achievement.theme %}<span class="badge theme-badge">{{ achievement.theme }}</span>{% endif %}
  <span class="badge tier-badge tier-color-{{ achievement.tier }}">
    {% if achievement.tier == 0 %}
      {% trans "Common" %}
    {% else %}
      {{ achievement.get_tier_display }}
    {% endif %}
  </span>
</div>
