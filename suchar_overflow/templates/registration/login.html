{% extends "base.html" %}

{% load i18n %}

{% block title %}
  {% translate "Sign In" %}
{% endblock title %}

{% block content %}
  <div class="container d-flex justify-content-center">
    <div class="col-md-6">
      <h1>{% translate "Sign In" %}</h1>
      <form class="login" method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {% include "snippets/form_body.html" %}
        <button class="primaryAction btn btn-primary w-100 mt-3" type="submit">{% translate "Sign In" %}</button>
      </form>
      <p class="mt-3">
        <a href="{% url 'password_reset' %}">{% translate "Forgot Password?" %}</a>
      </p>
    </div>
  </div>
{% endblock content %}
