volumes:
    suchar_overflow_local_postgres_data: {}
    suchar_overflow_local_postgres_data_backups: {}
    suchar_overflow_local_redis_data: {}

services:
    django: &django
        build:
            context: .
            dockerfile: ./compose/local/django/Dockerfile
        image: suchar_overflow_local_django
        container_name: suchar_overflow_local_django
        depends_on:
            postgres:
                condition: service_healthy
            mailpit:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - /app/.venv
            - .:/app:z
        env_file:
            - ./.envs/.local/.django
            - ./.envs/.local/.postgres
        ports:
            - '8000:8000'
        command: /start
        healthcheck:
            # GET /healthz/ (database + Redis); `start` runs migrate and compilemessages first.
            test: ['CMD', '/healthcheck', '8000']
            interval: 10s
            timeout: 6s
            retries: 5
            start_period: 60s

    # RQ worker (#460): same image as django, no port. It does not autoreload — run
    # `docker compose restart worker` (or `just build`) after changing task code.
    worker:
        build:
            context: .
            dockerfile: ./compose/local/django/Dockerfile
        image: suchar_overflow_local_django
        container_name: suchar_overflow_local_worker
        depends_on:
            django:
                condition: service_healthy
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            mailpit:
                condition: service_healthy
        volumes:
            - /app/.venv
            - .:/app:z
        env_file:
            - ./.envs/.local/.django
            - ./.envs/.local/.postgres
        command: /worker
        # A job may run up to DEFAULT_TIMEOUT (300 s); give RQ's warm shutdown time to finish it.
        stop_grace_period: 330s
        healthcheck:
            # Fails when no worker is registered on any queue in RQ_QUEUES.
            test: ['CMD', 'python', 'manage.py', 'rq_healthcheck']
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 30s

    # Periodic jobs (#462): exactly ONE instance, or every job is enqueued twice.
    cron:
        build:
            context: .
            dockerfile: ./compose/local/django/Dockerfile
        image: suchar_overflow_local_django
        container_name: suchar_overflow_local_cron
        depends_on:
            django:
                condition: service_healthy
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - /app/.venv
            - .:/app:z
        env_file:
            - ./.envs/.local/.django
            - ./.envs/.local/.postgres
        command: /cron
        healthcheck:
            # Fails when the CronScheduler's last heartbeat is older than 150 s.
            test: ['CMD', 'python', 'manage.py', 'rq_healthcheck', '--cron']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    postgres:
        build:
            context: .
            dockerfile: ./compose/base/postgres/Dockerfile
        image: suchar_overflow_local_postgres
        container_name: suchar_overflow_local_postgres
        volumes:
            - suchar_overflow_local_postgres_data:/var/lib/postgresql/18/docker
            - suchar_overflow_local_postgres_data_backups:/backups
        env_file:
            - ./.envs/.local/.postgres
        healthcheck:
            # -h 127.0.0.1: on a fresh volume the image's temporary initdb server listens on
            # the Unix socket only, so a socket probe could report healthy before the real one.
            test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 30s

    mailpit:
        image: docker.io/axllent/mailpit:v1.31.3
        container_name: suchar_overflow_local_mailpit
        ports:
            - '8025:8025'
        healthcheck:
            test: ['CMD', '/mailpit', 'readyz']
            interval: 5s
            timeout: 3s
            retries: 5

    redis:
        image: docker.io/redis:8.10
        container_name: suchar_overflow_local_redis
        # RDB snapshot every 60 s when at least one key changed: the RQ queue (#460)
        # lives here (database /1), so it must survive a container restart.
        command: --save 60 1 --loglevel warning
        volumes:
            - suchar_overflow_local_redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 5
