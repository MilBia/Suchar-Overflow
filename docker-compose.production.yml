volumes:
    production_postgres_cluster: {}
    production_postgres_data_backups: {}
    production_traefik: {}
    production_django_media: {}
    production_django_static: {}
    production_redis_data: {}

services:
    django: &django
        build:
            context: .
            dockerfile: ./compose/production/django/Dockerfile

        image: suchar_overflow_production_django
        volumes:
            - production_django_media:/app/suchar_overflow/media
            # `start` writes STATIC_ROOT (collectstatic); nginx serves it (#463).
            - production_django_static:/app/staticfiles
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        env_file:
            # Optional out-of-git secrets (e.g. third-party API keys). Listed first
            # because a later env_file overrides an earlier one: .envs/.production/*
            # wins, matching base.py, where the environment wins over this file.
            - path: ./.envs/.secrets
              required: false
            - ./.envs/.production/.django
            - ./.envs/.production/.postgres
        command: /start
        restart: unless-stopped
        healthcheck:
            # GET /healthz/ (database + Redis). `start` runs migrate and collectstatic
            # before gunicorn listens, hence the long start_period.
            test: ['CMD', '/healthcheck', '5000']
            interval: 30s
            timeout: 6s
            retries: 3
            start_period: 120s

    # RQ worker (#460): same image as django. Needs the media volume because tasks
    # may touch uploaded files; no port, nothing routes to it.
    worker:
        build:
            context: .
            dockerfile: ./compose/production/django/Dockerfile
        image: suchar_overflow_production_django
        volumes:
            - production_django_media:/app/suchar_overflow/media
        depends_on:
            django:
                condition: service_healthy
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        env_file:
            - path: ./.envs/.secrets
              required: false
            - ./.envs/.production/.django
            - ./.envs/.production/.postgres
        command: /worker
        # A job may run up to DEFAULT_TIMEOUT (300 s); give RQ's warm shutdown time to finish it.
        stop_grace_period: 330s
        restart: unless-stopped
        healthcheck:
            # Fails when no worker is registered on any queue in RQ_QUEUES.
            test: ['CMD', 'python', 'manage.py', 'rq_healthcheck']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    # Periodic jobs (#462): exactly ONE instance — never scale this service.
    cron:
        build:
            context: .
            dockerfile: ./compose/production/django/Dockerfile
        image: suchar_overflow_production_django
        depends_on:
            django:
                condition: service_healthy
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        env_file:
            - path: ./.envs/.secrets
              required: false
            - ./.envs/.production/.django
            - ./.envs/.production/.postgres
        command: /cron
        restart: unless-stopped
        healthcheck:
            # Fails when the CronScheduler's last heartbeat is older than 150 s.
            test: ['CMD', 'python', 'manage.py', 'rq_healthcheck', '--cron']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    postgres:
        build:
            context: .
            dockerfile: ./compose/base/postgres/Dockerfile
        image: suchar_overflow_production_postgres
        volumes:
            - production_postgres_cluster:/var/lib/postgresql
            - production_postgres_data_backups:/backups
        env_file:
            - ./.envs/.production/.postgres
        restart: unless-stopped
        healthcheck:
            # -h 127.0.0.1: on a fresh volume the image's temporary initdb server listens on
            # the Unix socket only, so a socket probe could report healthy before the real one.
            test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 30s

    traefik:
        build:
            context: .
            dockerfile: ./compose/production/traefik/Dockerfile
        image: suchar_overflow_production_traefik
        depends_on:
            django:
                condition: service_healthy
            # /static/ and /media/ are routed to nginx.
            nginx:
                condition: service_healthy
        volumes:
            - production_traefik:/etc/traefik/acme
        # The `ping` entrypoint (:8082) is deliberately not published: only the healthcheck uses it.
        ports:
            - '0.0.0.0:80:80'
            - '0.0.0.0:443:443'
        restart: unless-stopped
        healthcheck:
            # Reads the static config and probes the `ping` entrypoint (#496).
            test: ['CMD', 'traefik', 'healthcheck', '--ping']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    redis:
        image: docker.io/redis:8.10
        restart: unless-stopped
        # RDB snapshot every 60 s when at least one key changed: the RQ queue (#460)
        # lives here (database /1), so it must survive a container restart.
        command: --save 60 1 --loglevel warning
        volumes:
            - production_redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 5

    nginx:
        build:
            context: .
            dockerfile: ./compose/production/nginx/Dockerfile
        image: suchar_overflow_production_nginx
        depends_on:
            django:
                condition: service_healthy
        volumes:
            - production_django_media:/usr/share/nginx/media:ro
            - production_django_static:/usr/share/nginx/static:ro
        restart: unless-stopped
        healthcheck:
            # busybox wget (the alpine image has no curl); 127.0.0.1, since localhost may resolve to ::1.
            test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/nginx-health']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
