# Behind Traefik, which terminates TLS and routes /static/ and /media/ here (#463).
server {
  listen       80;
  server_name  localhost;

  # Compress what has no precompressed sibling. Not text/html: nginx never sees pages.
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;
  # Serve a precompressed `name.ext.gz` sibling when there is one instead of compressing per
  # request. Nothing writes them today (webpack emits none; the manifest storage neither), so every
  # response is compressed on the fly by `gzip on` above.
  gzip_static on;

  # `collectstatic` (ManifestStaticFilesStorage) writes here; the volume is read-only for nginx.
  location /static/ {
    alias /usr/share/nginx/static/;
    # Unhashed names (the originals collectstatic leaves next to the hashed copies)
    # can change under the same URL, so only a short cache for them.
    add_header Cache-Control "public, max-age=3600";
  }

  # `name.<12 hex>.ext` — the manifest storage's and webpack's (`[contenthash]`, 12 digits) hashed
  # names never change content, so they are cached for a year and never revalidated.
  # (A nested add_header would otherwise drop the outer one, so it is repeated.)
  # Quoted: nginx reads an unquoted `{` as the start of a block.
  location ~ "^/static/(?<hashed_path>.+\.[0-9a-f]{12}\.[A-Za-z0-9]+(?:\.[A-Za-z0-9]+)?)$" {
    alias /usr/share/nginx/static/$hashed_path;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /media/ {
    alias /usr/share/nginx/media/;
  }
}
